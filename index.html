<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>중2 인공지능 3차시 — 분류·예측·군집 평가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#1d2433; --muted:#6b7280; --line:#e4e0d6;
    --accent:#1f6f5c; --accent-soft:#e3f1ec; --warn:#b4532a; --warn-soft:#fbeee6;
    --ok:#1f7a4d; --bad:#c0392b; --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6}
  button,input,textarea{font:inherit;color:inherit}
  .wrap{max-width:820px;margin:0 auto;padding:28px 18px 120px}
  .wide{max-width:1180px}
  header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
  h1{font-size:28px;font-weight:900;margin:2px 0 0;letter-spacing:-.02em}
  h2{font-size:18px;margin:0 0 12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:16px}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:120px}
  .field label{font-size:14px;font-weight:700}
  input[type=text],input[type=number],textarea{border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;background:#fff;outline:none;width:100%}
  input:focus,textarea:focus{border-color:var(--accent)}
  .btn{white-space:nowrap;border:0;border-radius:10px;padding:12px 20px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;transition:transform .05s, opacity .15s}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
  .btn.plain{background:#efece4;color:var(--ink)}
  .btn.danger{background:var(--bad)}
  .tabs{display:flex;gap:6px;background:#ebe7dd;padding:4px;border-radius:12px}
  .tabs button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:700;cursor:pointer;color:var(--muted)}
  .tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  /* questions */
  .q{padding:20px 22px}
  .q-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
  .q-num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:900;display:grid;place-items:center;font-size:15px}
  .q.done .q-num{background:var(--accent);color:#fff}
  .q-text{font-weight:500;font-size:17px;padding-top:3px;white-space:pre-line}
  .q-pts{font-size:12px;color:var(--muted);margin-left:6px;font-weight:400}
  .opts{display:grid;gap:8px;margin-left:44px}
  .opt{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;background:#fff;text-align:left;width:100%}
  .opt:hover{border-color:#bfb9aa}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .opt .mark{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid #bfb9aa;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
  .opt.sel .mark{background:var(--accent);border-color:var(--accent);color:#fff}
  .short{margin-left:44px}
  .locked .opt{cursor:default}
  /* sticky footer */
  .footer{position:fixed;left:0;right:0;bottom:0;background:rgba(246,244,239,.94);backdrop-filter:blur(6px);border-top:1px solid var(--line)}
  .footer .inner{max-width:820px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px}
  .bar{flex:1;height:8px;background:#e4e0d6;border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
  /* code */
  .code-box{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;word-break:break-all;background:#f3f1ea;border:1.5px dashed #bfb9aa;border-radius:10px;padding:14px;user-select:all}
  .notice{border-radius:10px;padding:12px 14px;font-size:14px}
  .notice.ok{background:var(--accent-soft);color:#14513f}
  .notice.warn{background:var(--warn-soft);color:#7a3417}
  /* overlay dialog */
  .overlay{position:fixed;inset:0;background:rgba(20,24,33,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}
  .overlay.on{display:flex}
  .dialog{background:#fff;border-radius:16px;padding:24px;max-width:420px;width:100%}
  /* teacher */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
  .tile .k{font-size:13px;color:var(--muted);font-weight:500}
  .tile .v{font-size:28px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .tile .v small{font-size:14px;color:var(--muted);font-weight:500}
  .rate{display:grid;grid-template-columns:44px 1fr 52px;gap:10px;align-items:center;margin:6px 0;font-size:14px}
  .rate .track{height:14px;background:#efece4;border-radius:5px;overflow:hidden}
  .rate .fill{height:100%;background:var(--accent);border-radius:5px}
  .rate.low .fill{background:var(--warn)}
  .rate .pct{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
  .tbl-wrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
  th{font-size:12px;color:var(--muted);font-weight:700;background:#faf9f5;position:sticky;top:0}
  td.name{text-align:left;font-weight:700}
  td.score{font-weight:900;font-variant-numeric:tabular-nums}
  .o{color:var(--ok);font-weight:900}
  .x{color:var(--bad);font-weight:900}
  .x .ans{display:block;font-size:11px;font-weight:400;color:var(--muted);max-width:80px;overflow:hidden;text-overflow:ellipsis}
  .del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;padding:4px 8px;border-radius:6px}
  .del:hover{background:#f3e6e3;color:var(--bad)}
  .del.confirm{background:var(--bad);color:#fff}
  .key-list{columns:2;font-size:14px;margin:0;padding-left:20px}
  @media (max-width:720px){.tiles{grid-template-columns:repeat(2,1fr)}.key-list{columns:1}h1{font-size:23px}.opts,.short{margin-left:0}}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-weight:700;font-size:14px;cursor:pointer}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  td.ans{font-size:13px;max-width:110px;overflow:hidden;text-overflow:ellipsis}
  td.ans.ok{background:#e6f4ec;color:#145c39}
  td.ans.bad{background:#fbe9e7;color:#9b2c1f;font-weight:700}
  tr.keyrow td{background:#fff8e6;font-size:12px;font-weight:700;color:#7a5a00;border-bottom:2px solid #e9d9a8}
  tr.cls-break td{border-top:3px solid #cfc9bb}
  .lg{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:3px}
  .lg.ok{background:#cde9d8}.lg.bad{background:#f5cdc7}
  .pts-in{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);flex:none}
  .pts-in input{width:64px;padding:6px 8px;text-align:right}
  .ok-tag{margin-left:auto;font-size:12px;font-weight:700;color:#fff;background:var(--accent);border-radius:99px;padding:2px 10px}
  .ans-chips{display:flex;gap:6px;flex-wrap:wrap;min-height:30px;align-items:center}
  .achip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:#14513f;border-radius:99px;padding:4px 6px 4px 12px;font-weight:700;font-size:14px}
  .achip button{border:0;background:rgba(0,0,0,.08);border-radius:50%;width:20px;height:20px;line-height:18px;cursor:pointer;font-size:14px;padding:0}
  td.crit{font-size:12px;font-weight:700;cursor:pointer;user-select:none}
  td.crit.ok{background:#d9efe2;color:#145c39}
  td.crit.bad{background:#f8dcd7;color:#9b2c1f}
  td.crit.man{outline:2px dashed #7a6a3a;outline-offset:-4px}
  td.crit:hover{filter:brightness(.95)}
  th.crit-h{background:#f1efe6;color:var(--ink)}
  .wide-label .rate{grid-template-columns:72px 1fr 52px}
  .crit-tag{flex:none;font-size:12px;font-weight:700;color:#5b4a14;background:#f7efd4;border-radius:99px;padding:3px 10px;margin-top:4px}
  .rubric{display:grid;grid-template-columns:1fr 220px;gap:16px}
  .rubric table{border:1px solid var(--line)}
  @media (max-width:720px){.rubric{grid-template-columns:1fr}}
  .hidden{display:none !important}
</style>
</head>
<body>

<!-- ===================== STUDENT VIEW ===================== -->
<div id="studentView">
  <div class="wrap">
    <header class="top">
      <div>
        <div class="eyebrow" id="quizSubject"></div>
        <h1 id="quizTitle"></h1>
      </div>
    </header>

    <!-- step 1: info -->
    <section id="stepInfo" class="card">
      <h2>응시자 정보</h2>
      <p class="muted small" style="margin-top:-6px">반, 번호, 이름을 정확히 입력하세요. 선생님이 성적을 정리할 때 사용합니다.</p>
      <div class="row" style="margin:14px 0 18px">
        <div class="field" style="max-width:110px"><label for="inCls">반</label><input id="inCls" type="number" min="1" max="30" inputmode="numeric" placeholder="예: 3"></div>
        <div class="field" style="max-width:110px"><label for="inNo">번호</label><input id="inNo" type="number" min="1" max="60" inputmode="numeric" placeholder="예: 12"></div>
        <div class="field"><label for="inName">이름</label><input id="inName" type="text" maxlength="20" placeholder="홍길동"></div>
      </div>
      <div class="notice warn small" style="margin-bottom:16px" id="quizInfoLine"></div>
      <button class="btn" id="btnStart" disabled>시험 시작</button>
    </section>

    <!-- step 2: quiz -->
    <section id="stepQuiz" class="hidden">
      <div class="card small muted" id="whoLine" style="padding:12px 18px"></div>
      <div id="qList"></div>
    </section>

    <!-- step 3: done -->
    <section id="stepDone" class="hidden">
      <div class="card">
        <h2>✅ 답안 작성이 끝났어요</h2>
        <p style="margin-top:-4px">아래 <b>제출 코드</b>를 복사해서 선생님께 보내야 제출이 완료됩니다. (학급 단톡방, 메시지 등 선생님이 안내한 곳으로)</p>
        <div class="code-box" id="codeBox"></div>
        <div class="row" style="margin-top:14px;align-items:center">
          <button class="btn" id="btnCopy">코드 복사하기</button>
          <span class="small" id="copyMsg"></span>
        </div>
        <p class="small muted" style="margin-top:16px">복사 버튼이 안 되면 코드 상자를 길게 누르거나 클릭해 전체 선택한 뒤 복사하세요. 코드가 한 글자라도 빠지면 채점되지 않아요.</p>
      </div>
      <div class="card">
        <h2 style="font-size:16px">내 답안 확인</h2>
        <div id="myAnswers" class="small"></div>
        <button class="btn plain" id="btnReset" style="margin-top:14px">처음부터 다시 (다른 학생)</button>
      </div>
    </section>
  </div>

  <div class="footer hidden" id="footer">
    <div class="inner">
      <span class="small" id="progTxt" style="white-space:nowrap;font-weight:700"></span>
      <div class="bar"><i id="progBar"></i></div>
      <button class="btn" id="btnSubmit">제출하기</button>
    </div>
  </div>
</div>

<!-- confirm dialog -->
<div class="overlay" id="dlg">
  <div class="dialog">
    <h2 id="dlgTitle"></h2>
    <p id="dlgBody" class="muted" style="margin-top:-4px"></p>
    <div class="row" style="justify-content:flex-end;margin-top:16px">
      <button class="btn plain" id="dlgNo">취소</button>
      <button class="btn" id="dlgYes">확인</button>
    </div>
  </div>
</div>

<script>
/* ------------------------------------------------------------------
   시험 문제 (정답은 여기에 없습니다 — 선생님 전용 저장소에만 있어요)
------------------------------------------------------------------- */
const QUIZ = {
  id: "ai2-ml-models-03-v3",
  subject: "중학교 2학년 인공지능 · 3차시",
  title: "분류 · 예측 · 군집 모델 확인 평가",
  questions: [
    {c:"c2", type:"mc", text:"유튜브 AI가 ‘이 댓글은 악플일까, 아닐까?’를 판단할 때, AI가 내놓는 답의 모양과 모델을 바르게 짝지은 것은?", opts:["이름 – 분류","숫자 – 예측","묶음 – 군집","숫자 – 분류"]},
    {c:"c4", type:"mc", text:"‘이 영상의 조회수는 몇 회쯤 나올까?’를 알려 주는 AI에 쓰인 모델은?", opts:["분류","예측","군집"]},
    {c:"c6", type:"mc", text:"‘시청 기록이 비슷한 사람끼리 묶어 영상을 추천한다’에 쓰인 모델은?", opts:["분류","예측","군집"]},
    {c:"c1", type:"short", text:"빈칸에 알맞은 말을 쓰시오. 분류 모델은 (     )이 붙은 데이터를 학습한다.", hint:"괄호에 들어갈 말"},
    {c:"c1", type:"mc", text:"분류 모델이 새 데이터가 어느 그룹에 속하는지 판단하는 방법으로 옳은 것은?", opts:["새 데이터와 가장 비슷한 범주를 고른다.","새 데이터를 넣어 결과 값(숫자)을 계산한다.","새 데이터와 값이 가까운 것끼리 새로 묶는다.","사람이 직접 범주의 이름을 정해 준다."]},
    {c:"c2", type:"short", text:"분류 모델의 예시입니다. 빈칸에 알맞은 말을 쓰시오. 이메일 → 일반 메일 / (     ) 메일", hint:"괄호에 들어갈 말"},
    {c:"c3", type:"mc", text:"예측 모델의 학습 원리로 옳은 것은?", opts:["정답이 없는 데이터를 모아 비슷한 것끼리 묶는다.","입력값과 결과값이 짝지어진 데이터를 학습해 둘 사이의 관계를 찾는다.","범주마다 특징과 패턴을 찾아 이름을 붙인다.","데이터를 무작위로 골라 결과를 정한다."]},
    {c:"c4", type:"mc", text:"다음 중 예측 모델이 알맞은 것만 고른 것은?\nㄱ. 공부 시간으로 시험 점수(0~100점)를 예상한다.\nㄴ. 내일 비가 올지 안 올지 판단한다.\nㄷ. 집의 넓이와 위치로 집값을 예상한다.\nㄹ. 손글씨 숫자 사진을 보고 0~9 중 어떤 숫자인지 알아낸다.", opts:["ㄱ, ㄷ","ㄱ, ㄹ","ㄴ, ㄷ","ㄱ, ㄷ, ㄹ"]},
    {c:"c5", type:"mc", text:"군집 모델의 학습 원리로 옳은 것은?", opts:["정답(이름표)이 붙은 데이터로 범주마다 특징을 찾는다.","입력값과 결과값의 관계를 찾아 숫자를 계산한다.","정답이 없는 데이터에서 값이 가까운 것끼리 묶는다.","새 데이터와 가장 비슷한 범주를 고른다."]},
    {c:"c5", type:"short", text:"빈칸에 알맞은 말을 쓰시오. 군집 모델이 만든 묶음의 이름은 (     )이 나중에 붙인다.", hint:"괄호에 들어갈 말"},
    {c:"c6", type:"mc", text:"다음 중 군집 모델을 활용한 예시와 그 설명이 옳은 것은?", opts:["뉴스 기사를 분석해, 정답 없이 비슷한 내용끼리 묶는다.","지난 기온 기록으로 내일 기온이 몇 도일지 계산한다.","이름표가 붙은 메일로 배워 새 메일이 스팸인지 판단한다.","사진을 보고 ‘고양이’ 또는 ‘개’라는 이름을 붙인다."]},
    {c:"c3", type:"mc", text:"‘학습할 때 정답(이름표)이 있나?’와 ‘결과는?’ 두 질문으로 모델을 구별했습니다. 바르게 짝지은 것은?", opts:["분류 – 정답 있다 – 숫자","예측 – 정답 있다 – 숫자","군집 – 정답 있다 – 묶음","예측 – 정답 없다 – 이름"]}
  ]
};
const CIRCLED = ["①","②","③","④","⑤","⑥"];
const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const DRAFT_KEY = "quiz-draft-" + QUIZ.id;

/* ---------- code encode / decode ---------- */
function b64urlEncode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64urlDecode(s){
  s = s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="=";
  const bin = atob(s); const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function fnv(str){ let h=0x811c9dc5; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return h.toString(36); }
function makeCode(payload){ const p = b64urlEncode(JSON.stringify(payload)); return "QZ1." + p + "." + fnv(QUIZ.id + p); }
function parseCode(code){
  const m = /^QZ1\.([A-Za-z0-9_-]+)\.([a-z0-9]+)$/.exec(code);
  if(!m) return null;
  if(fnv(QUIZ.id + m[1]) !== m[2]) return {error:"다른 시험의 코드이거나 일부가 잘렸어요"};
  try{
    const d = JSON.parse(b64urlDecode(m[1]));
    if(d.q !== QUIZ.id || !Array.isArray(d.a)) return {error:"다른 시험의 코드예요"};
    return {data:d, id:m[2] + "-" + fnv(m[1])};
  }catch(e){ return {error:"코드를 읽을 수 없어요"}; }
}

/* ======================= STUDENT ======================= */
let state = store.get(DRAFT_KEY) || {cls:"",no:"",name:"",answers:Array(QUIZ.questions.length).fill(""),step:"info",code:""};
if(!Array.isArray(state.answers) || state.answers.length !== QUIZ.questions.length) state.answers = Array(QUIZ.questions.length).fill("");
/* 문항 순서: 학생마다 무작위로 섞고, 새로고침해도 같은 순서가 유지되도록 저장. 답은 원래 문항 번호 자리에 저장되어 채점에는 영향 없음 */
function shuffledOrder(){ const o=QUIZ.questions.map((_,i)=>i); for(let i=o.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [o[i],o[j]]=[o[j],o[i]]; } return o; }
function validOrder(o){ return Array.isArray(o) && o.length===QUIZ.questions.length && [...o].sort((a,b)=>a-b).every((v,i)=>v===i); }
if(!validOrder(state.order)) state.order = (state.step==="info") ? null : shuffledOrder();
const order = () => validOrder(state.order) ? state.order : QUIZ.questions.map((_,i)=>i);

$("quizSubject").textContent = QUIZ.subject;
$("quizTitle").textContent = QUIZ.title;
const nMC = QUIZ.questions.filter(q=>q.type==="mc").length;
$("quizInfoLine").textContent = `총 ${QUIZ.questions.length}문항 (객관식 ${nMC}, 단답형 ${QUIZ.questions.length-nMC}). 제출하면 답을 고칠 수 없어요.`;

function save(){ store.set(DRAFT_KEY, state); }

["inCls","inNo","inName"].forEach(id=>{
  const el=$(id); const key={inCls:"cls",inNo:"no",inName:"name"}[id];
  el.value = state[key] || "";
  el.addEventListener("input",()=>{ state[key]=el.value.trim(); save(); checkInfo(); });
});
function checkInfo(){ $("btnStart").disabled = !(state.cls && state.no && state.name); }
checkInfo();
$("btnStart").onclick = ()=>{ if(!validOrder(state.order)) state.order = shuffledOrder(); state.step="quiz"; save(); renderQuestions(); showStep(); window.scrollTo(0,0); };

function renderQuestions(){
  const box = $("qList"); box.innerHTML = "";
  order().forEach((i,pos)=>{
    const q = QUIZ.questions[i];
    const c = document.createElement("div"); c.className = "card q"; c.id = "q"+i;
    const head = document.createElement("div"); head.className="q-head";
    const num = document.createElement("div"); num.className="q-num"; num.textContent = pos+1;
    const tx = document.createElement("div"); tx.className="q-text"; tx.textContent = q.text;
    head.append(num,tx); c.appendChild(head);
    if(q.type==="mc"){
      const opts = document.createElement("div"); opts.className="opts";
      q.opts.forEach((o,j)=>{
        const b = document.createElement("button"); b.type="button"; b.className="opt";
        const mk = document.createElement("span"); mk.className="mark"; mk.textContent = j+1;
        const t = document.createElement("span"); t.textContent = o;
        b.append(mk,t);
        b.onclick = ()=>{ state.answers[i] = String(j); save(); paintQ(i); updateProgress(); };
        opts.appendChild(b);
      });
      c.appendChild(opts);
    } else {
      const w = document.createElement("div"); w.className="short";
      const inp = document.createElement("input"); inp.type="text"; inp.maxLength=40; inp.placeholder = "답: " + (q.hint||"");
      inp.value = state.answers[i] || "";
      inp.addEventListener("input",()=>{ state.answers[i]=inp.value.trim(); save(); paintQ(i); updateProgress(); });
      w.appendChild(inp); c.appendChild(w);
    }
    box.appendChild(c); paintQ(i);
  });
}
function paintQ(i){
  const c = $("q"+i); if(!c) return;
  c.classList.toggle("done", state.answers[i]!=="");
  c.querySelectorAll(".opt").forEach((b,j)=> b.classList.toggle("sel", state.answers[i]===String(j)));
}
function updateProgress(){
  const n = state.answers.filter(a=>a!=="").length, N = QUIZ.questions.length;
  $("progTxt").textContent = `${n} / ${N} 문항`;
  $("progBar").style.width = (n/N*100)+"%";
}

$("btnSubmit").onclick = ()=>{
  const empty = order().map((i,pos)=>state.answers[i]===""?pos+1:null).filter(Boolean);
  const body = empty.length
    ? `아직 풀지 않은 문항이 있어요: ${empty.join(", ")}번. 그래도 제출할까요? 제출 후에는 답을 고칠 수 없어요.`
    : "제출하면 답을 고칠 수 없어요. 제출 코드를 만들까요?";
  confirmDlg(empty.length?"빈 문항이 있어요":"제출할까요?", body, ()=>{
    state.code = makeCode({q:QUIZ.id, c:state.cls, n:state.no, nm:state.name, a:state.answers, t:Date.now()});
    state.step = "done"; save(); showStep(); window.scrollTo(0,0);
  });
};

function renderDone(){
  $("codeBox").textContent = state.code;
  const box = $("myAnswers"); box.innerHTML="";
  const p = document.createElement("p"); p.style.margin="0 0 8px";
  p.textContent = `${state.cls}반 ${state.no}번 ${state.name}`; p.style.fontWeight="700"; box.appendChild(p);
  order().forEach((i,pos)=>{
    const q = QUIZ.questions[i], a = state.answers[i];
    const line = document.createElement("div");
    line.textContent = `${pos+1}번: ` + (a===""?"(빈칸)": q.type==="mc" ? `${CIRCLED[+a]} ${q.opts[+a]}` : a);
    box.appendChild(line);
  });
}
$("btnCopy").onclick = async ()=>{
  try{ await navigator.clipboard.writeText(state.code); $("copyMsg").textContent="복사됐어요! 이제 선생님께 붙여넣어 보내세요."; $("copyMsg").style.color="var(--ok)"; }
  catch(e){ selectCode(); $("copyMsg").textContent="자동 복사가 막혀 있어요. 선택된 코드를 직접 복사하세요 (Ctrl+C / 길게 누르기)."; $("copyMsg").style.color="var(--warn)"; }
};
function selectCode(){ try{ const r=document.createRange(); r.selectNodeContents($("codeBox")); const s=getSelection(); s.removeAllRanges(); s.addRange(r);}catch(e){} }
$("btnReset").onclick = ()=> confirmDlg("처음으로 돌아갈까요?","지금 화면의 제출 코드가 사라져요. 코드를 이미 보냈는지 확인하세요.", ()=>{
  store.del(DRAFT_KEY);
  state = {cls:"",no:"",name:"",answers:Array(QUIZ.questions.length).fill(""),step:"info",code:"",order:null};
  ["inCls","inNo","inName"].forEach(id=>$(id).value=""); checkInfo(); renderQuestions(); showStep();
});

function showStep(){
  $("stepInfo").classList.toggle("hidden", state.step!=="info");
  $("stepQuiz").classList.toggle("hidden", state.step!=="quiz");
  $("stepDone").classList.toggle("hidden", state.step!=="done");
  $("footer").classList.toggle("hidden", state.step!=="quiz");
  if(state.step==="quiz"){ $("whoLine").textContent = `응시자: ${state.cls}반 ${state.no}번 ${state.name}`; updateProgress(); }
  if(state.step==="done") renderDone();
}
renderQuestions(); showStep();

/* ---------- dialog ---------- */
let dlgCb = null;
function confirmDlg(title, body, cb, yesLabel){
  $("dlgTitle").textContent = title; $("dlgBody").textContent = body; $("dlgYes").textContent = yesLabel || "확인";
  dlgCb = cb; $("dlg").classList.add("on");
}
$("dlgNo").onclick = ()=>{ $("dlg").classList.remove("on"); dlgCb=null; };
$("dlgYes").onclick = ()=>{ $("dlg").classList.remove("on"); const f=dlgCb; dlgCb=null; f && f(); };

</script>
</body>
</html>
